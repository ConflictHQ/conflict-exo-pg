astrolift_version = 1
name = "conflict-exo-pg"

[app]
slug = "conflict-exo-pg"
display_name = "Exoplanets on Aurora"

[environments.production]

[[workloads]]
name = "web"
kind = "deployment"
replicas = 1
is_public = true
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "192Mi"
memory_limit = "384Mi"

[[workloads.containers]]
name = "web"
is_primary = true
port = 8080

[workloads.containers.healthcheck]
kind = "http"
value = "/health"
port = 8080

[workloads.containers.env]
PYTHONUNBUFFERED = "1"
DB_CONNECT_TIMEOUT = "45"

[[managed_services]]
kind = "postgres"
name = "planets"
variant = "aurora_postgres_serverless_v2"
size = "small"

[managed_services.extensions]
min_acu = 0
max_acu = 2
seconds_until_auto_pause = 300
engine_version = "16.6"

[ingress]
class = "alb"

[ingress.auth]
kind = "cognito"
user_pool_arn = "arn:aws:cognito-idp:us-west-2:790347818717:userpool/us-west-2_xU96Y7DAg"
user_pool_client_id = "1e3f2egf7ibju4c9rnldk98cvv"
user_pool_domain = "conflict"
