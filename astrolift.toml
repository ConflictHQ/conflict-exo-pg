# astrolift.toml — Astrolift app manifest
#
# The point of this fixture is the managed service at the bottom, not the app.
#
# Aurora Serverless v2 with min_acu = 0 and auto-pause: after five minutes with
# no connections the cluster scales its compute to zero and stops billing for
# it. Storage keeps costing about a dime per GB-month; compute costs nothing.
# The first query afterwards pays a resume, which is why the dashboard puts
# connection latency on its front page instead of hiding it.

astrolift_version = 1
name = "conflict-exo-pg"

[app]
slug = "conflict-exo-pg"
display_name = "Exoplanets on Aurora"

[environments.production]

[[workloads]]
name = "web"
kind = "deployment"
replicas = 1
is_public = true
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "192Mi"
memory_limit = "384Mi"

  [[workloads.containers]]
  name = "web"
  is_primary = true
  port = 8080

    # Liveness deliberately does not touch the database. A paused Aurora would
    # otherwise read as an unhealthy pod and get restarted mid-resume.
    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

    [workloads.containers.env]
    PYTHONUNBUFFERED = "1"
    # A resume from 0 ACU takes appreciably longer than a warm connect.
    DB_CONNECT_TIMEOUT = "45"

[[managed_services]]
kind = "postgres"
name = "planets"
variant = "aurora_postgres_serverless_v2"
size = "small"

  [managed_services.extensions]
  # 0 is the whole point. seconds_until_auto_pause is only accepted when
  # min_acu is 0 -- the driver validates that pairing
  # (providers/aws/managed/aurora.py: "auto-pause requires min_acu=0").
  min_acu = 0
  max_acu = 2
  seconds_until_auto_pause = 300
  # Pinned rather than left to the AWS default: 0 ACU needs a recent minor.
  engine_version = "16.6"
